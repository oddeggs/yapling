<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* The stage: one painted place, the critters in it, and the words. The app draws its controls over it. */
:root {
  --bg: #09080b; --bone: #f0ebe2; --dim: rgba(240,235,226,.62); --faint: rgba(240,235,226,.36);
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --ny: ui-serif, "New York", Newsreader, "Iowan Old Style", Georgia, serif;
  --soft: cubic-bezier(.22,1,.36,1); --soft-d: 700ms;
  --top: env(safe-area-inset-top, 47px); --bottom: env(safe-area-inset-bottom, 34px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--bone); overflow: hidden; -webkit-font-smoothing: antialiased }
#cv, #snap { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
#snap { pointer-events: none; opacity: 0 }
.scrim { position: absolute; inset: auto 0 0; height: 58%; background: linear-gradient(to top, rgba(7,6,9,.88), rgba(7,6,9,.62) 42%, rgba(7,6,9,0)); opacity: 0; transition: opacity 1.2s var(--soft); pointer-events: none }
.scrim.on { opacity: 1 }

/* the painting's title, top left, like the label on a gallery wall */
.label { position: absolute; left: 28px; right: 28px; top: calc(var(--top) + 46px); pointer-events: none }
.label h2 { margin: 0; font: italic 400 29px/1.08 var(--ny); letter-spacing: -.01em; text-wrap: balance; text-shadow: 0 1px 18px rgba(0,0,0,.28) }
.label p { margin: 10px 0 0; font: 600 10.5px/1.4 var(--sf); letter-spacing: .2em; text-transform: uppercase; color: rgba(240,235,226,.74); text-shadow: 0 1px 10px rgba(0,0,0,.35); font-variant-numeric: tabular-nums }
.label > * { opacity: 0; filter: blur(12px); transform: translateY(-8px); transition: opacity .9s var(--soft), filter .9s var(--soft), transform 1.1s var(--soft) }
.label.on > * { opacity: 1; filter: none; transform: none }
.label.on p { transition-delay: .18s }

/* captions: the character's words in a book serif, yours below in the system face */
.cap { position: absolute; left: 28px; right: 28px; bottom: calc(var(--bottom) + 92px); pointer-events: none }
.line { margin: 0; position: relative }
.say { font: 400 27px/1.17 var(--ny); letter-spacing: -.012em; text-wrap: pretty; transition: opacity .7s var(--soft), transform .8s var(--soft), filter .8s var(--soft); transform-origin: 0 100% }
.say.dim { opacity: .38; transform: translateY(-6px) scale(.965) }
.say.dim + .gloss { opacity: .3; transition: opacity .7s var(--soft) }
.gloss { font: 400 14px/1.45 var(--sf); color: var(--dim); margin-top: 10px; min-height: 1.45em }
.you { font: 500 18px/1.38 var(--sf); letter-spacing: -.01em; margin-top: 22px; min-height: 1.38em; color: #fff }
/* a word arrives like paint going on: a soft stroke sweeps left to right while it rises out of a blur */
.w { display: inline-block; white-space: pre; opacity: 0; filter: blur(9px); transform: translateY(.36em) rotate(1.2deg); transform-origin: 0 100%;
  -webkit-mask-image: linear-gradient(90deg, #000 42%, transparent 58%); mask-image: linear-gradient(90deg, #000 42%, transparent 58%); -webkit-mask-size: 260% 100%; mask-size: 260% 100%; -webkit-mask-position: 100% 0; mask-position: 100% 0 }
.w.in { animation: wIn var(--soft-d) var(--soft) forwards, wSweep .5s cubic-bezier(.3,.7,.3,1) forwards }
.say .w.in { animation: wIn var(--soft-d) var(--soft) forwards, wSweep .5s cubic-bezier(.3,.7,.3,1) forwards, wInk 1.6s ease-out forwards }
@keyframes wIn { to { opacity: 1; filter: blur(0); transform: none } }
@keyframes wSweep { to { -webkit-mask-position: 0 0; mask-position: 0 0 } }
@keyframes wInk { from { color: #ffd9b8 } to { color: var(--bone) } }
.you .w { transition: color .6s var(--soft), text-shadow .6s var(--soft) }
.you .w.part { color: var(--faint) }
.you.final .w { animation-name: wIn, wSweep, wSet; animation-duration: var(--soft-d), .5s, .9s; animation-timing-function: var(--soft), ease, ease-out; animation-fill-mode: forwards; color: #fff }
@keyframes wSet { 0% { text-shadow: 0 0 0 rgba(255,255,255,0) } 30% { text-shadow: 0 0 14px rgba(255,255,255,.55) } 100% { text-shadow: 0 0 0 rgba(255,255,255,0) } }
@media (prefers-reduced-motion: reduce) { .w, .w.in, .say .w.in { animation: none; opacity: 1; filter: none; transform: none; -webkit-mask-image: none; mask-image: none } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="snap"></canvas>
<div class="scrim" id="scrim"></div>
<div class="label" id="label"><h2 id="lTitle"></h2><p id="lSub"></p></div>
<div class="cap"><div id="sayBox"></div><p class="line you" id="you"></p></div>
